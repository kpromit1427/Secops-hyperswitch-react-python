name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run GitLeaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy:
   runs-on: ubuntu-latest
   needs: gitleaks
   env:
     TRIVY_DISABLE_VEX_NOTICE: true   # disable VEX notice globally for this job
   steps:
     - name: Checkout code
       uses: actions/checkout@v3

     - name: Run Trivy vulnerability scan
       uses: aquasecurity/trivy-action@master
       with:
         scan-type: fs
         path: .
         format: table
         severity: HIGH,CRITICAL

  build-and-test:
    runs-on: ubuntu-latest
    needs: trivy  # <-- enforce dependency
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run backend unit tests
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pytest test_server.py
  docker:
    runs-on: ubuntu-latest
    needs: build-and-test   # <-- ensures Docker build only runs if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/app:latest

