name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run GitLeaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy:
   runs-on: ubuntu-latest
   needs: gitleaks
   env:
     TRIVY_DISABLE_VEX_NOTICE: true   # disable VEX notice globally for this job
   steps:
     - name: Checkout code
       uses: actions/checkout@v3

     - name: Run Trivy vulnerability scan
       uses: aquasecurity/trivy-action@master
       with:
         scan-type: fs
         path: .
         format: table
         severity: HIGH,CRITICAL

  build-and-test:
    runs-on: ubuntu-latest
    needs: trivy  # <-- enforce dependency
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run backend unit tests
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pytest test_server.py
  docker:
    runs-on: ubuntu-latest
    needs: build-and-test   # <-- ensures Docker build only runs if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/app:latest
  trivy-image:
    runs-on: ubuntu-latest
    needs: docker   # run only after the image is built & pushed
    steps:
      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/app:latest
          format: table
          severity: HIGH,CRITICAL
  deploy:
    runs-on: ubuntu-latest
    needs: trivy-image
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
   # - name: Install AWS CLI
    #  run: |
     #  curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      # unzip awscliv2.zip
       #sudo ./aws/install
       #aws --version

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: latest

    - name: Configure kubeconfig
      run: |
       mkdir -p $HOME/.kube
       echo "${{ secrets.EKS_KUBECONFIG }}" > $HOME/.kube/config
    - name: Deploy to EKS
      run: |
       kubectl apply -f k8s-prod/sc.yaml
       kubectl apply -f k8s-prod/backend.yaml
       kubectl apply -f k8s-prod/frontend.yaml
       kubectl apply -f k8s-prod/ci.yaml
       kubectl apply -f k8s-prod/ingress.yaml



